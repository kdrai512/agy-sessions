[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "agy-sessions"
version = "0.1.0"
description = "Interactive TUI session manager for Google Antigravity (agy) CLI"
readme = "README.md"
authors = [
  { name = "Kunjdhari Rai", email = "987kundanrai@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.8"
keywords = [
  "antigravity",
  "agy",
  "ai",
  "cli",
  "session-manager",
  "fzf",
  "tui",
  "gemini"
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: User Interfaces",
  "Topic :: Utilities"
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kdrai512/agy-sessions"
Repository = "https://github.com/kdrai512/agy-sessions.git"
Issues = "https://github.com/kdrai512/agy-sessions/issues"

[project.scripts]
agy-sessions = "agy_sessions.cli:main"
agys = "agy_sessions.cli:main"
